# Releases carla-pack when a version tag is pushed:
#   1. the tag (vX.Y.Z) must match the version in Cargo.toml,
#   2. wheels and the sdist are built (wheels.yml),
#   3. a GitHub Release is created with them attached and generated notes,
#   4. optionally they are uploaded to PyPI (trusted publishing; see the README).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
      - name: The tag matches Cargo.toml
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match Cargo.toml version $version (expected v$version)"
            exit 1
          fi
          locked=$(python3 -c 'import tomllib; print(next(p["version"] for p in tomllib.load(open("Cargo.lock", "rb"))["package"] if p["name"] == "carla-pack"))')
          if [ "$locked" != "$version" ]; then
            echo "::error::Cargo.lock has carla-pack $locked, Cargo.toml has $version: run cargo update -p carla-pack"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "prerelease=true" ;; *) echo "prerelease=false" ;; esac >> "$GITHUB_OUTPUT"

  test:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test

  build:
    needs: check
    uses: ./.github/workflows/wheels.yml

  github-release:
    needs: [check, test, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          flags=(--title "carla-pack $TAG" --generate-notes --verify-tag)
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" "${flags[@]}" dist/*

  pypi:
    # Opt in with the repository variable PUBLISH_PYPI=true once PyPI trusts this workflow.
    if: vars.PUBLISH_PYPI == 'true'
    needs: [check, github-release]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/carla-pack/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
